<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አስተዳደር ገጽ (Admin Panel)</title>
</head>
<body>
    <div id="adminSection">
        <h2>መረጃ ማስተዳደሪያ ፎርም</h2>
        <form id="newsForm">
            <input type="hidden" id="editPostId">
            
            <div>
                <label for="newsCategory">ምድብ (Category):</label>
                <input type="text" id="newsCategory" value="News" required>
            </div>

            <div>
                <label for="mediaUrl">የሚዲያ ሊንክ (Media URL):</label>
                <input type="text" id="mediaUrl">
            </div>

            <!-- አማርኛ -->
            <fieldset>
                <legend>አማርኛ</legend>
                <label>ርዕስ:</label>
                <input type="text" id="titleAM">
                <label>ይዘት:</label>
                <textarea id="contentAM"></textarea>
            </fieldset>

            <!-- ኦሮምኛ -->
            <fieldset>
                <legend>Afaan Oromoo</legend>
                <label>Mmatawwa:</label>
                <input type="text" id="titleOR">
                <label>Qabiyyee:</label>
                <textarea id="contentOR"></textarea>
            </fieldset>

            <!-- እንግሊዝኛ -->
            <fieldset>
                <legend>English</legend>
                <label>Title:</label>
                <input type="text" id="titleEN">
                <label>Content:</label>
                <textarea id="contentEN"></textarea>
            </fieldset>

            <button type="submit" id="formSubmitBtn">መረጃውን በትክክል ለጥፍ</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // እባክዎ የፋየርቤዝ ማዋቀሪያዎን (Firebase Config) እዚህ ጋር ያስገቡ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let deletedStaticIds = JSON.parse(localStorage.getItem('deletedStaticIds')) || [];

        async function loadData() {
            try {
                const querySnapshot = await getDocs(collection(db, "news"));
                querySnapshot.forEach((docSnap) => {
                    // መረጃዎችን እዚህ ማሳየት ይቻላል
                    const data = docSnap.data();
                });
            } catch (err) {
                console.error("መረጃዎችን በማንበብ ላይ ስህተት ተፈጥሯል: ", err);
            }
        }

        window.editPost = (p) => {
            document.getElementById("editPostId").value = p.id;
            document.getElementById("newsCategory").value = p.category || 'News';
            document.getElementById("mediaUrl").value = p.media || '';

            // ሰነዱ ባለብዙ ቋንቋ ስለሆነ በቋንቋው መሰረት ቅጹን መሙላት
            document.getElementById("titleAM").value = '';
            document.getElementById("contentAM").value = '';
            document.getElementById("titleOR").value = '';
            document.getElementById("contentOR").value = '';
            document.getElementById("titleEN").value = '';
            document.getElementById("contentEN").value = '';

            if(p.lang === 'AM') {
                document.getElementById("titleAM").value = p.title || '';
                document.getElementById("contentAM").value = p.content || '';
            } else if(p.lang === 'OR') {
                document.getElementById("titleOR").value = p.title || '';
                document.getElementById("contentOR").value = p.content || '';
            } else if(p.lang === 'EN') {
                document.getElementById("titleEN").value = p.title || '';
                document.getElementById("contentEN").value = p.content || '';
            }

            document.getElementById("formSubmitBtn").innerText = "መረጃውን አስተካክል (Update)";
            document.getElementById("adminSection").scrollIntoView({ behavior: 'smooth' });
        }

        window.deletePost = async (id) => {
            if(confirm("ይህን መረጃ ማጥፋት ይፈልጋሉ?")) {
                if(id.startsWith('clean_v4_')) {
                    deletedStaticIds.push(id);
                    localStorage.setItem('deletedStaticIds', JSON.stringify(deletedStaticIds));
                    loadData();
                } else {
                    try {
                        await deleteDoc(doc(db, "news", id));
                        loadData();
                    } catch(err) {
                        console.error("Error deleting document: ", err);
                        alert("ማጥፋት ላይ ችግር አጋጥሟል።");
                    }
                }
            }
        }

        // የፎርም ማስረከቢያ (Create / Update)
        document.getElementById("newsForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById("editPostId").value;
            const category = document.getElementById("newsCategory").value;
            const media = document.getElementById("mediaUrl").value.trim();

            const titleAM = document.getElementById("titleAM").value.trim();
            const contentAM = document.getElementById("contentAM").value.trim();

            const titleOR = document.getElementById("titleOR").value.trim();
            const contentOR = document.getElementById("contentOR").value.trim();

            const titleEN = document.getElementById("titleEN").value.trim();
            const contentEN = document.getElementById("contentEN").value.trim();

            let postsToProcess = [];

            if(titleAM && contentAM) {
                postsToProcess.push({ lang: 'AM', title: titleAM, content: contentAM });
            }
            if(titleOR && contentOR) {
                postsToProcess.push({ lang: 'OR', title: titleOR, content: contentOR });
            }
            if(titleEN && contentEN) {
                postsToProcess.push({ lang: 'EN', title: titleEN, content: contentEN });
            }

            if(postsToProcess.length === 0) {
                alert("እባክዎ ቢያንስ የአንድ ቋንቋ ርዕስ እና ይዘት ያስገቡ!");
                return;
            }

            try {
                if(editId) {
                    let single = postsToProcess[0];
                    if(editId.startsWith('clean_v4_')) {
                        deletedStaticIds.push(editId);
                        localStorage.setItem('deletedStaticIds', JSON.stringify(deletedStaticIds));
                        await addDoc(collection(db, "news"), {
                            category,
                            media,
                            lang: single.lang,
                            title: single.title,
                            content: single.content,
                            createdAt: Date.now()
                        });
                    } else {
                        const docRef = doc(db, "news", editId);
                        await updateDoc(docRef, {
                            category,
                            media,
                            lang: single.lang,
                            title: single.title,
                            content: single.content
                        });
                    }
                } else {
                    for(let p of postsToProcess) {
                        await addDoc(collection(db, "news"), {
                            category,
                            media,
                            lang: p.lang,
                            title: p.title,
                            content: p.content,
                            createdAt: Date.now()
                        });
                    }
                }

                this.reset();
                document.getElementById("editPostId").value = "";
                document.getElementById("formSubmitBtn").innerText = "መረጃውን በትክክል ለጥፍ";
                loadData();
                alert("መረጃው በተሳካ ሁኔታ ተመዝግቧል!");
            } catch(err) {
                console.error("Error saving document: ", err);
                alert("መረጃውን ማስቀመጥ ላይ ችግር አጋጥሟል።");
            }
        });

        loadData();
    </script>
</body>
</html>
